{% extends "base.html" %}
{% block title %}Register Account — CareerSync{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div style="text-align:center; font-size:36px; margin-bottom:8px;">🚀</div>
    <h2>Create CareerSync Account</h2>
    <p class="auth-subtitle">Organize, track, and improve your student career journey</p>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label>Full Student Name</label>
            <input type="text" name="name" placeholder="Rasika Chinchalkar / Payal Koyare" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="student@tgpcet.ac.in" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Create strong password" required>
        </div>

        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:8px;">
            Create Account & Launch
        </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--text-muted);">
        Already registered? <a href="{{ url_for('login') }}" style="color:var(--cyan-light); font-weight:700;">Sign In</a>
    </div>
</div>
{% endblock %}
