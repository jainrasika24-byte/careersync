{% extends "base.html" %}
{% block title %}Login — CareerSync{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div style="text-align:center; font-size:36px; margin-bottom:8px;">✨</div>
    <h2>Welcome to CareerSync</h2>
    <p class="auth-subtitle">AI-Powered Student Career & Skill Management Platform</p>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label>Student Email Address</label>
            <input type="email" name="email" placeholder="student@tgpcet.ac.in" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:8px;">
            Sign In to Dashboard
        </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:13.5px; color:var(--text-muted);">
        Don't have an account? <a href="{{ url_for('register') }}" style="color:var(--cyan-light); font-weight:700;">Register Here</a>
    </div>
</div>
{% endblock %}
